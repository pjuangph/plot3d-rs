[package]
name = "plot3d"
version = "0.1.11"
edition = "2021"
license = "MIT"
description = "Utilities for reading, writing, and manipulating NASA PLOT3D structured grids."

[lib]
name = "plot3d"
path = "src/lib.rs"

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
metis-rs = { version = "0.1", optional = true }

# for tests (download)
reqwest = { version = "0.12", features = ["blocking"] }
indicatif = "0.18.4"
rayon = "1.11.0"

[features]
default = []
f32 = []
metis-partition = ["metis-rs"]

[dev-dependencies]
tempfile = "3.10"
